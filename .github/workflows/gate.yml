# The same gate `check.py` runs locally, on every push and pull request.
#
# **WHY BOTH THIS AND A PRE-COMMIT HOOK.** They fail in opposite directions and that
# is the point rather than duplication. The hook is fast and runs before the mistake
# is recorded -- and it does NOT run until somebody types
# `git config core.hooksPath .githooks`, which a fresh clone silently skips. This
# runs on a machine nobody configured, and reports after the push rather than before.
#
# **A gate that silently does not run is worse than no gate**, which is the failure
# this repository already paid for once: it had no gate at all until 2026-08-19, and
# a British spelling reached `board_state.py` unnoticed.
#
# **NO SECRET IS NEEDED, and that decided the design.** The word table lives in
# `FlickrGroupAddr/backend-api`, which is PUBLIC. The `~/.claude` wrapper would have
# been the obvious source and lives in `claude-config`, which is PRIVATE -- reaching
# it from this public repository would mean a personal access token stored as a
# secret. **A spell-checker is not worth a credential in a public repository.**
name: gate

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out localswim
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # **The canonical word table, borrowed rather than copied.** A second copy of
      # that list would drift, and the list is the whole tool.
      - name: Check out the word table
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: FlickrGroupAddr/backend-api
          path: .word-table-src
          persist-credentials: false

      - name: Install pinned uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python from .python-version
        run: uv python install

      - name: Install pinned workflow linters
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="$(mktemp -d)"

          curl --fail --location --silent --show-error \
            --output "$tool_dir/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $tool_dir/actionlint.tar.gz" \
            | sha256sum --check --strict
          tar --extract --gzip --file "$tool_dir/actionlint.tar.gz" --directory "$tool_dir"
          sudo install --mode 0755 "$tool_dir/actionlint" /usr/local/bin/actionlint

          curl --fail --location --silent --show-error \
            --output "$tool_dir/shellcheck.tar.xz" \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $tool_dir/shellcheck.tar.xz" \
            | sha256sum --check --strict
          tar --extract --xz --file "$tool_dir/shellcheck.tar.xz" --directory "$tool_dir"
          sudo install --mode 0755 \
            "$tool_dir/shellcheck-v0.11.0/shellcheck" /usr/local/bin/shellcheck

      - name: Synchronize locked project environment
        run: uv sync --locked --extra monitor

      # **The path is passed explicitly rather than guessed.** `check.py`'s fallback
      # guesses are Terry's machine; CI knows exactly where it put things, and saying
      # so means a checkout change fails loudly instead of quietly falling through to
      # a guess that happens to be wrong.
      - name: Run the gate
        run: >
          uv run --frozen --extra monitor python check.py
          --word-table .word-table-src/scripts/claude-dirty-words.py

      - name: Build source and wheel distributions
        run: uv build --no-sources --clear

      - name: Smoke-test the built wheel
        run: >
          uv run --isolated --no-project --python 3.15.1
          --with ./dist/localswim-*.whl
          python -c
          "import importlib.resources, localswim;
          assert importlib.resources.files(localswim).joinpath('rules.json').is_file()"
