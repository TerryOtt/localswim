[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[project]
name = "localswim"
version = "0.1.0"
description = "A local swimlane board for one human and one automation agent."
readme = "README.md"
requires-python = ">=3.15,<3.16"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Terry Ott" }]
keywords = ["kanban", "local-first", "swimlane", "task-board"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]
dependencies = ["click==8.5.1"]

[project.urls]
Homepage = "https://github.com/TerryOtt/localswim"
Issues = "https://github.com/TerryOtt/localswim/issues"
Repository = "https://github.com/TerryOtt/localswim"

[project.scripts]
localswim = "localswim.api_endpoint:main"
localswim-cli = "localswim.cli:main"

[dependency-groups]
dev = [
    "pyright==1.1.414",
    "pytest==9.2.0",
    "ruff==0.17.4",
]

[tool.uv]
required-version = "==0.13.7"

[tool.uv.build-backend]
source-include = [
    ".githooks/pre-commit",
    "AGENTS.md",
    "CONTRIBUTING.md",
    "check.py",
    "docs/**",
    "examples/**",
    "tests/**",
]

[tool.pyright]
include = ["src", "check.py", "tests"]
pythonPlatform = "All"
pythonVersion = "3.15"
typeCheckingMode = "strict"

[[tool.pyright.executionEnvironments]]
root = "tests"
extraPaths = [".", "src"]
# Tests deliberately exercise module-private restart and preflight seams.
reportPrivateUsage = false

[tool.pytest.ini_options]
minversion = "9.1"
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--import-mode=importlib", "--strict-config", "--strict-markers"]
xfail_strict = true
filterwarnings = ["error"]

[tool.ruff]
target-version = "py315"
preview = false
line-length = 100

[tool.ruff.lint]
# Stable checks selected for defects, security, typing, and consistent imports.
select = [
    "A", "ANN", "ARG", "ASYNC", "B", "BLE", "C90", "DTZ", "E402", "E722", "E9",
    "EXE", "F", "G", "I", "INP001", "ISC002", "LOG", "PGH003", "PGH004",
    "PIE794", "PIE796", "PLE", "PLW0120", "PLW0127", "PLW0128", "PLW0129",
    "PLW0133", "PLW0177", "PLW0245", "PLW0406", "PLW0602", "PLW0642",
    "PLW0711", "PLW1501", "PLW1507", "PLW1508", "PLW1509", "PLW1510",
    "PLW1641", "PLW2101", "PLW2901", "PTH210", "S", "SIM115", "SLF001",
    "T10", "TID251", "TRY002", "TRY201", "TRY203",
    # Test assertions, fixture setup, and regex matching.
    "PT010", "PT011", "PT012", "PT014", "PT015", "PT019", "PT020", "PT021",
    "PT025", "PT028", "PT030", "PT031", "RUF043",
    # Runtime footguns and malformed or obsolete lint directives.
    "RUF006", "RUF008", "RUF009", "RUF012", "RUF013", "RUF016", "RUF017",
    "RUF018", "RUF024", "RUF026", "RUF028", "RUF030", "RUF032", "RUF033",
    "RUF049", "RUF053", "RUF063", "RUF064", "RUF068", "RUF071", "RUF10", "RUF200",
    # Maintain the supported Python typing and import conventions.
    "UP005", "UP006", "UP007", "UP019", "UP035", "UP040", "UP044", "UP045",
]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = false
mypy-init-return = true

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = [
    # Pytest assertions are not runtime validation and must survive optimization rules.
    "S101",
    # Tests intentionally use loopback URLs and trusted local subprocess commands.
    "S310",
    "S603",
    "S607",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
docstring-code-line-length = "dynamic"
